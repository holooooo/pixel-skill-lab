<body>
<header id="topbar">
  <div class="logo-wrap">
    <a class="home-link" href="https://holooooo.pages.dev" title="返回 HOLOOOOO 主站">← 回到主站</a>

  </div>
  <div class="top-actions">
    <span id="assetStatus" class="chip dim">加载模型中…</span>
    <button id="btnPause" class="btn" title="P">⏸ 暂停</button>

    <button id="btnImport" class="btn">⇩ 从剪贴板导入</button>
    <button id="btnExportAll" class="btn">⇧ 导出全部</button>
    <button id="btnReset" class="btn danger">↺ 恢复预设</button>
    <button id="btnHelp" class="btn">？ 操作说明</button>

    </a>
    <button id="btnLang" class="btn icon-btn" title="Language / 语言">EN</button>
  </div>
</header>

<aside id="library">
  <nav class="tabs" id="libTabs">
    <button data-tab="active" class="on">技能</button>
    <button data-tab="passive">被动</button>
    <button data-tab="buff">Buff</button>
    <button data-tab="unit">单位/场景</button>
  </nav>
  <div class="lib-tools">
    <input id="libSearch" placeholder="搜索…" />
    <button id="btnNew" class="btn small accent">＋ 新建</button>
  </div>
  <div id="libList" class="lib-list"></div>
</aside>

<main id="arenaWrap">
  <div id="overlay"></div>
  <div id="flash"></div>
  <div id="hudTop">
    <div id="meter" class="panel glass"></div>
  </div>
  <div id="hudBottom">
    <div id="heroBars">
      <div class="bar hp"><i></i><i class="sh"></i><span></span></div>
      <div class="bar mp"><i></i><span></span></div>
    </div>
    <div id="hotbar"></div>
    <div id="passbar"></div>
  </div>
  <div id="log" class="panel glass"></div>
  <div id="hint">WASD 移动 · 左键选目标 · 右键移动 · 1-8 施法 · Tab 切换目标 · P 暂停</div>
</main>

<section id="timeline">
  <div class="tl-head">
    <div id="tlTitle"></div>
    <div id="tlFlow"></div>
    <div class="tl-tools">
      <button id="btnTry" class="btn accent">▶ 试放</button>
      <label class="chip">缩放 <input id="tlZoom" type="range" min="60" max="400" value="170" /></label>
      <label class="chip">吸附 <select id="tlSnap"><option value="0.05">0.05s</option><option value="0.1" selected>0.1s</option><option value="0.25">0.25s</option><option value="0">无</option></select></label>
    </div>
  </div>
  <div class="tl-body">
    <div id="palette"></div>
    <div id="tracksWrap"><div id="tracks"></div></div>
  </div>
</section>

<aside id="inspector"></aside>

<div id="modal" class="hidden"><div class="modal-card"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div></div>
